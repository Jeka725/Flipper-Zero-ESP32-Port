name: Build Flipper ESP32-S3 ST7735S

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 N16R8 ST7735S 1.8
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_s3_st7735/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          echo "IDF_PATH=$IDF_PATH"
          idf.py --version

      - name: Build
        run: |
          source ~/esp/esp-idf/export.sh
          bash ./build.sh --board esp32s3_st7735 --build-only

      - name: Package firmware
        run: |
          BUILD="build_s3_st7735"
          STAGE="artifact_staging"

          rm -rf "$STAGE"
          mkdir -p "$STAGE/wokwi"

          # Keep every flash image at its real generated size.
          # The OTA/LittleFS partition layout intentionally spans the 16 MB
          # address space, so one contiguous merged binary necessarily contains
          # the unused address gaps. Do not package that padded image.
          cp "$BUILD/bootloader/bootloader.bin" "$STAGE/bootloader.bin"
          cp "$BUILD/partition_table/partition-table.bin" "$STAGE/partition-table.bin"
          cp "$BUILD/furi_esp32.bin" "$STAGE/furi_esp32.bin"
          cp "$BUILD/ota_data_initial.bin" "$STAGE/ota_data_initial.bin"
          cp "$BUILD/littlefs.bin" "$STAGE/littlefs.bin"
          cp "$BUILD/flash_args" "$STAGE/flash_args"

          echo "=== Real image sizes ==="
          stat -c '%n %s bytes' \
            "$STAGE/bootloader.bin" \
            "$STAGE/partition-table.bin" \
            "$STAGE/furi_esp32.bin" \
            "$STAGE/ota_data_initial.bin" \
            "$STAGE/littlefs.bin"

          cp wokwi/diagram.json "$STAGE/wokwi/diagram.json"
          cp wokwi/wokwi.toml "$STAGE/wokwi/wokwi.toml"
          cp "$BUILD/furi_esp32.bin" "$STAGE/wokwi/furi_esp32.bin"
          cp "$BUILD/littlefs.bin" "$STAGE/wokwi/littlefs.bin"

      - name: Upload firmware and Wokwi project
        uses: actions/upload-artifact@v7
        with:
          name: flipper-esp32s3-st7735-firmware
          path: artifact_staging/
          retention-days: 30
