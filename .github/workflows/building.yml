name: Build Flipper ESP32-S3 ST7735S
# CI validates every main update before a firmware artifact is considered ready.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 N16R8 ST7735S 1.8
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_s3_st7735/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          echo "IDF_PATH=$IDF_PATH"
          idf.py --version

      - name: Build
        run: |
          source ~/esp/esp-idf/export.sh
          bash ./build.sh --board esp32s3_st7735 --build-only

      - name: Package firmware
        run: |
          BOARD="esp32s3_st7735"
          CHIP="esp32s3"
          FLASH_SIZE="16MB"
          BUILD="build_s3_st7735"
          STAGE="artifact_staging"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          source ~/esp/esp-idf/export.sh
          python -m esptool --chip "$CHIP" merge-bin \
            --flash-size "$FLASH_SIZE" \
            -o "$STAGE/${BOARD}.bin" \
            0x0 "$BUILD/bootloader/bootloader.bin" \
            0x8000 "$BUILD/partition_table/partition-table.bin" \
            0x10000 "$BUILD/furi_esp32.bin" \
            0xBF0000 "$BUILD/ota_data_initial.bin" \
            0xC20000 "$BUILD/littlefs.bin"

          # Keep the image exactly 16 MiB. This is intentional: browser flashers
          # that enable compressed transfer can otherwise stop near 99% while
          # handling a sparse/short merged image against a 16 MiB target.
          # Compression still reduces the actual transfer of repeated 0xFF data.
          mv "$STAGE/${BOARD}.bin" "$STAGE/firmware.bin"
          test "$(stat -c %s "$STAGE/firmware.bin")" -eq 16777216

          echo "=== Full 16 MiB compression-safe firmware image ==="
          stat -c '%n %s bytes' "$STAGE/firmware.bin"
          python -m esptool --chip "$CHIP" image-info "$STAGE/firmware.bin"

          # Verify the exact command used by common ESP32 flashers.
          # esptool enables compressed transfer by default; --compress is
          # explicit here so the generated flash instructions match the
          # intended fast/sparse transfer mode.
          python -m esptool --chip "$CHIP" write-flash --help | grep -q -- "--no-compress"

          cat > "$STAGE/flash-esp32s3-compressed.txt" <<'EOF'
ESP32-S3 N16R8 — single-image flashing
1. Select firmware.bin.
2. Flash address: 0x0
3. Enable "Compress" / compressed transfer.
4. Flash size: 16 MB.
5. If the web flasher has a separate erase option, erase before flashing once.
EOF

          rm -rf "$STAGE/wokwi"
          mkdir -p "$STAGE/wokwi"
          cp wokwi/diagram.json "$STAGE/wokwi/diagram.json"
          cp wokwi/wokwi.toml "$STAGE/wokwi/wokwi.toml"
          cp "$STAGE/firmware.bin" "$STAGE/wokwi/firmware.bin"
          cp "$BUILD/littlefs.bin" "$STAGE/wokwi/littlefs.bin"

      - name: Upload firmware BIN
        uses: actions/upload-artifact@v7
        with:
          name: flipper-esp32s3-st7735-firmware-bin
          path: artifact_staging/firmware.bin
          retention-days: 30
          if-no-files-found: error

      - name: Upload flashing instructions
        uses: actions/upload-artifact@v7
        with:
          name: flipper-esp32s3-st7735-flash-info
          path: artifact_staging/flash-esp32s3-compressed.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload Wokwi test project
        uses: actions/upload-artifact@v7
        with:
          name: flipper-esp32s3-st7735-wokwi
          path: artifact_staging/wokwi
          retention-days: 30
          if-no-files-found: error
