name: Build Flipper ESP32-S3 ST7735S

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 N16R8 ST7735S 1.8
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_s3_st7735/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: |
            ~/esp/esp-idf
            ~/.espressif
          key: esp-idf-v5.4.1-ubuntu24-python3.12
          restore-keys: esp-idf-v5.4.1-ubuntu24-python3.12

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          echo "IDF_PATH=$IDF_PATH"
          idf.py --version

      - name: Build
        run: |
          source ~/esp/esp-idf/export.sh
          bash ./build.sh --board esp32s3_st7735 --build-only

      - name: Package firmware
        run: |
          BOARD="esp32s3_st7735"
          CHIP="esp32s3"
          BUILD="build_s3_st7735"
          STAGE="artifact_staging"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          source ~/esp/esp-idf/export.sh

          # Produce exactly one flashable firmware.bin.
          # Do not pass --flash_size: merge_bin stops at the highest
          # supplied image end and does not add an independent full-flash tail.
          # All required flash offsets are preserved in the merged image.
          python -m esptool --chip "$CHIP" merge_bin \
            -o "$STAGE/${BOARD}.bin" \
            0x0 "$BUILD/bootloader/bootloader.bin" \
            0x8000 "$BUILD/partition_table/partition-table.bin" \
            0x10000 "$BUILD/furi_esp32.bin" \
            0xBF0000 "$BUILD/ota_data_initial.bin" \
            0xC20000 "$BUILD/littlefs.bin"

          # Trim only unused trailing 0xFF bytes. The previous workflow
          # uploaded a 16 MiB image because the LittleFS partition reaches the
          # end of flash; the unused tail is not required for flashing.
          python - <<'PY'
          from pathlib import Path

          path = Path("artifact_staging/esp32s3_st7735.bin")
          data = path.read_bytes()
          original = len(data)
          end = original
          while end and data[end - 1] == 0xFF:
              end -= 1
          if end == 0:
              raise SystemExit("Refusing to create an empty firmware image")
          path.write_bytes(data[:end])
          print(f"Original merged image: {original} bytes ({original / 1024 / 1024:.2f} MiB)")
          print(f"Trimmed firmware image: {end} bytes ({end / 1024 / 1024:.2f} MiB)")
          print(f"Removed trailing 0xFF padding: {original - end} bytes")
          PY

          mv "$STAGE/${BOARD}.bin" "$STAGE/firmware.bin"

          echo "=== Compact single firmware image ==="
          stat -c '%n %s bytes' "$STAGE/firmware.bin"
          python -m esptool --chip "$CHIP" image_info "$STAGE/firmware.bin"


      - name: Upload single firmware.bin
        uses: actions/upload-artifact@v7
        with:
          name: flipper-esp32s3-st7735-firmware
          path: artifact_staging/firmware.bin
          if-no-files-found: error
          retention-days: 30
