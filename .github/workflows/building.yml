name: Build Flipper ESP32-S3 ST7735S
# CI validates every main update before a firmware artifact is considered ready.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 N16R8 ST7735S 1.8
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_s3_st7735/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git wget flex bison gperf python3 python3-pip python3-venv             cmake ninja-build ccache libffi-dev libssl-dev dfu-util             libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1             https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          idf.py --version

      - name: Build
        run: |
          source ~/esp/esp-idf/export.sh
          bash ./build.sh --board esp32s3_st7735 --build-only

      - name: Package firmware
        run: |
          BOARD="esp32s3_st7735"
          BUILD="build_s3_st7735"
          STAGE="artifact_staging"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          source ~/esp/esp-idf/export.sh
          # Do not force the merged image to the full 16 MiB flash size.
          # The ESP32-S3 has a 16 MiB flash chip, but the useful image ends
          # before the final 0xFF padding. Keeping that padding makes mobile
          # flashers transfer ~16 MiB and can make compressed writes appear
          # stuck at 99%.
          python -m esptool --chip esp32s3 merge_bin             -o "$STAGE/firmware.bin"             0x0 "$BUILD/bootloader/bootloader.bin"             0x8000 "$BUILD/partition_table/partition-table.bin"             0x10000 "$BUILD/furi_esp32.bin"             0xBF0000 "$BUILD/ota_data_initial.bin"             0xC20000 "$BUILD/littlefs.bin"

          python - <<'PY'
from pathlib import Path
p = Path("artifact_staging/firmware.bin")
data = p.read_bytes()
trimmed = data.rstrip(b"\xff")
if not trimmed:
    raise SystemExit("firmware.bin became empty")
p.write_bytes(trimmed)
print(f"firmware.bin: {len(data)} -> {len(trimmed)} bytes")
PY

          # Validate that the merged image is non-empty and remains within
          # the physical 16 MiB flash limit. Do not run image_info on the
          # raw merged file after trimming: image_info is intended for ESP
          # image files, while this artifact is a flash-addressed container.
          test -s "$STAGE/firmware.bin"
          test "$(stat -c %s "$STAGE/firmware.bin")" -le 16777216
          test "$(python -c 'from pathlib import Path; print(Path("artifact_staging/firmware.bin").read_bytes()[0])')" -eq 233

          # Keep the Wokwi copy identical to the downloadable firmware.

          rm -rf "$STAGE/wokwi"
          mkdir -p "$STAGE/wokwi"
          cp wokwi/diagram.json "$STAGE/wokwi/diagram.json"
          cp wokwi/wokwi.toml "$STAGE/wokwi/wokwi.toml"
          cp "$STAGE/firmware.bin" "$STAGE/wokwi/firmware.bin"
          cp "$BUILD/littlefs.bin" "$STAGE/wokwi/littlefs.bin"

      - name: Upload firmware BIN
        uses: actions/upload-artifact@v7
        with:
          name: flipper-esp32s3-st7735-firmware-bin
          path: artifact_staging/firmware.bin
          retention-days: 30
          if-no-files-found: error
