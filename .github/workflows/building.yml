name: Build Flipper ESP32-S3 ST7735S
# CI validates every main update before a firmware artifact is considered ready.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 N16R8 ST7735S 1.8
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_s3_st7735/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          echo "IDF_PATH=$IDF_PATH"
          idf.py --version

      - name: Build
        run: |
          source ~/esp/esp-idf/export.sh
          bash ./build.sh --board esp32s3_st7735 --build-only

      - name: Package firmware
        run: |
          BOARD="esp32s3_st7735"
          CHIP="esp32s3"
          FLASH_SIZE="16MB"
          BUILD="build_s3_st7735"
          STAGE="artifact_staging"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          source ~/esp/esp-idf/export.sh
          python -m esptool --chip "$CHIP" merge_bin \
            -o "$STAGE/${BOARD}.bin" \
            0x0 "$BUILD/bootloader/bootloader.bin" \
            0x8000 "$BUILD/partition_table/partition-table.bin" \
            0x10000 "$BUILD/furi_esp32.bin" \
            0xBF0000 "$BUILD/ota_data_initial.bin" \
            0xC20000 "$BUILD/littlefs.bin"

          # Remove only unused trailing 0xFF bytes. Keep all required
          # flash offsets inside one compact, directly flashable image.
          python - <<'PY'
          from pathlib import Path

          path = Path("artifact_staging/esp32s3_st7735.bin")
          data = path.read_bytes()
          original = len(data)
          end = original
          while end and data[end - 1] == 0xFF:
              end -= 1
          if end == 0:
              raise SystemExit("Refusing to create an empty firmware image")

          # Keep the compact image, but finish on a 4 KiB flash-sector
          # boundary.  This avoids a partial final sector in browser
          # flashers when transport compression is enabled.
          sector = 4096
          trimmed = data[:end]
          padded_end = ((end + sector - 1) // sector) * sector
          trimmed += b"\\xFF" * (padded_end - end)

          path.write_bytes(trimmed)
          print(f"Original merged image: {original} bytes ({original / 1024 / 1024:.2f} MiB)")
          print(f"Trimmed firmware image: {end} bytes ({end / 1024 / 1024:.2f} MiB)")
          print(f"4 KiB-aligned firmware image: {padded_end} bytes ({padded_end / 1024 / 1024:.2f} MiB)")
          print(f"Removed trailing 0xFF padding: {original - padded_end} bytes")
          PY

          mv "$STAGE/${BOARD}.bin" "$STAGE/firmware.bin"

          echo "=== Compact single firmware image ==="
          stat -c '%n %s bytes' "$STAGE/firmware.bin"
          python -m esptool --chip "$CHIP" image_info "$STAGE/firmware.bin"

          rm -rf "$STAGE/wokwi"
          mkdir -p "$STAGE/wokwi"
          cp wokwi/diagram.json "$STAGE/wokwi/diagram.json"
          cp wokwi/wokwi.toml "$STAGE/wokwi/wokwi.toml"
          cp "$STAGE/firmware.bin" "$STAGE/wokwi/firmware.bin"
          cp "$BUILD/littlefs.bin" "$STAGE/wokwi/littlefs.bin"

      - name: Upload firmware and Wokwi project
        uses: actions/upload-artifact@v7
        with:
          name: flipper-esp32s3-st7735-firmware
          path: artifact_staging/firmware.bin
          retention-days: 30
